# Local Camunda 8 for this sample: the orchestration cluster (engine, Operate, Tasklist) with an
# in-memory H2 database, plus the connectors runtime that runs the AI Agent.
#
#   docker compose up -d                       Camunda 8.10 without connectors (for simulate mode)
#   docker compose --profile llm up -d         Camunda 8.10 with the connectors runtime (real LLM)
#   CAMUNDA_VERSION=8.9.26 CAMUNDA_CONNECTORS_VERSION=8.9.17 docker compose --profile llm up -d   (8.9)
#
# Data is lost on restart. The API is unprotected: for a laptop only, never for shared use.
# Secrets: the 8.10 models read =camunda.secrets.NAME from the files in ./secrets (file name = secret name,
# contents = value). The 8.9 models read {{secrets.NAME}} from the connectors container's environment.
services:
  camunda:
    image: camunda/camunda:${CAMUNDA_VERSION:-8.10.6}
    ports:
      - "8080:8080"     # REST API, Operate, Tasklist
      - "26500:26500"   # gRPC API
    environment:
      # Local login for Operate, Tasklist and Admin: demo / demo
      CAMUNDA_SECURITY_INITIALIZATION_USERS_0_USERNAME: demo
      CAMUNDA_SECURITY_INITIALIZATION_USERS_0_PASSWORD: demo
      CAMUNDA_SECURITY_INITIALIZATION_USERS_0_NAME: Demo User
      CAMUNDA_SECURITY_INITIALIZATION_USERS_0_EMAIL: demo@example.com
      CAMUNDA_SECURITY_INITIALIZATION_DEFAULTROLES_ADMIN_USERS_0: demo
      CAMUNDA_SECURITY_AUTHENTICATION_UNPROTECTEDAPI: "true"
      CAMUNDA_SECURITY_AUTHORIZATIONS_ENABLED: "false"
      CAMUNDA_DATA_SECONDARYSTORAGE_TYPE: rdbms
      CAMUNDA_DATA_SECONDARYSTORAGE_RDBMS_URL: jdbc:h2:mem:chatbot;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
      CAMUNDA_DATA_SECONDARYSTORAGE_RDBMS_USERNAME: sa
      CAMUNDA_DATA_SECONDARYSTORAGE_RDBMS_PASSWORD: ""
      # Camunda 8.10 secret store: one file per secret in ./secrets
      CAMUNDA_SECRETS_STORES_FILE_DEFAULT_PATH: /etc/camunda/secrets
    volumes:
      - ./secrets:/etc/camunda/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 && echo -e \"GET /actuator/health/status HTTP/1.1\r\nHost: localhost\r\n\r\n\" >&3 && head -n 1 <&3 | grep -q 200'"]
      interval: 5s
      retries: 30
      start_period: 30s

  connectors:
    profiles: ["llm"]   # simulate mode must run without it: both would take the AI agent jobs
    image: camunda/connectors-bundle:${CAMUNDA_CONNECTORS_VERSION:-8.10.2}
    environment:
      CAMUNDA_CLIENT_MODE: self-managed
      CAMUNDA_CLIENT_GRPCADDRESS: http://camunda:26500
      CAMUNDA_CLIENT_RESTADDRESS: http://camunda:8080
      # Legacy {{secrets.NAME}} for the 8.9 models. Only variables with this prefix are visible.
      CAMUNDA_CONNECTOR_SECRETPROVIDER_ENVIRONMENT_PREFIX: CONNECTORS_SECRET_
      CONNECTORS_SECRET_CHATBOT_AWS_ACCESS_KEY: ${CHATBOT_AWS_ACCESS_KEY:-}
      CONNECTORS_SECRET_CHATBOT_AWS_SECRET_KEY: ${CHATBOT_AWS_SECRET_KEY:-}
      CONNECTORS_SECRET_CHATBOT_LLM_API_KEY: ${CHATBOT_LLM_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the agent reach an LLM gateway running on your machine
    depends_on:
      camunda:
        condition: service_healthy
